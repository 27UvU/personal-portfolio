<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS 基础 - 麦脆鸡个人主页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">🍟</span>
                <span>麦脆鸡</span>
            </a>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="index.html#courses" class="active">课程</a></li>
                <li><a href="index.html#about">关于</a></li>
            </ul>
            <button class="nav-toggle" id="nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- 课程详情 Hero 区域 -->
    <section class="course-hero course-hero-blue">
        <a href="index.html#courses" class="back-link">
            ← 返回课程列表
        </a>
        <div class="course-hero-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
            </svg>
        </div>
        <h1>HTML & CSS 基础</h1>
        <p>从零开始学习网页开发的基础知识，掌握HTML结构和CSS样式技巧，构建美观的响应式网页。</p>
    </section>

    <!-- 课程内容 -->
    <section class="course-content">
        <div class="container">
            <div class="content-placeholder">
                <div class="placeholder-icon">📚</div>
                <h2>课程内容开发中</h2>
                <p>本课程正在积极开发中，敬请期待！</p>
                <div class="placeholder-topics">
                    <h3>课程将包含以下内容：</h3>
                    <ul>
                        <li>HTML5 基础语法与语义化标签</li>
                        <li>CSS3 选择器与样式规则</li>
                        <li>盒模型与布局技术</li>
                        <li>响应式设计与媒体查询</li>
                        <li>Flexbox 与 Grid 布局</li>
                        <li>CSS 动画与过渡效果</li>
                        <li>实战项目：构建个人作品集网站</li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 麦脆鸡个人主页. 保留所有权利.</p>
        </div>
    </footer>

    <script>
        // 导航栏滚动效果
        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // 移动端导航菜单
        const navToggle = document.getElementById('nav-toggle');
        const navLinks = document.getElementById('nav-links');

        navToggle.addEventListener('click', function() {
            navLinks.classList.toggle('open');
            navToggle.classList.toggle('open');
        });
    </script>
</body>
</html>
